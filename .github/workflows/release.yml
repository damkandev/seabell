name: Release

# Pushear un tag vX.Y.Z publica los instaladores de escritorio en GitHub Releases.
# En otras ramas que tocan la app de escritorio solo compila y deja los instaladores como artifacts.
on:
  push:
    tags: ["v*"]
    branches-ignore: ["main"]
    paths: [".github/workflows/release.yml", "apps/desktop/**"]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "Seabell ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundle: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            asset: Seabell-macOS.dmg
          - os: windows-latest
            rust-targets: ""
            args: --bundles nsis
            bundle: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            asset: Seabell-Windows.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @seabell/desktop tauri build ${{ matrix.args }}
      # Copia con nombre fijo para que releases/latest/download/<asset> siempre apunte a la última versión.
      - run: cp ${{ matrix.bundle }} "${{ matrix.asset }}"
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7

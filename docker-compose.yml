services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seabell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - seabell-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seabell"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  seabell-postgres-data:
